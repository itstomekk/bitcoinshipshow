<style>
  @font-face { font-family: "Pirata One"; src: url("assets/PirataOne-Regular.ttf") format("truetype"); }
  :root {
    --sea: #061726; --sea-mid: #0C2E4A; --sea-lite: #14486F;
    --ink: #0B1F33; --parch: #CBDCE8; --parch-dk: #A9C3D6;
    --gold: #D9AE3C; --accent: #1E6FA6;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100svh; display: flex; align-items: center; justify-content: center;
    background: var(--sea); color: var(--parch);
    font-family: "IM Fell English", Georgia, serif;
    padding: 40px 22px; text-align: center;
  }
  .card {
    max-width: 560px; background: var(--parch); color: var(--ink);
    border: 4px solid var(--gold); box-shadow: 14px 14px 0 0 var(--ink);
    padding: 42px 36px 38px;
  }
  .card .eyebrow {
    display: inline-block; background: var(--accent); color: var(--parch);
    border: 2px solid var(--gold); padding: 5px 14px; margin-bottom: 20px;
    font-size: 12px; letter-spacing: .26em; text-transform: uppercase;
  }
  h1 {
    font-family: "Pirata One", serif; font-weight: 400;
    font-size: clamp(44px, 9vw, 72px); line-height: .9; color: var(--ink);
    text-shadow: 4px 4px 0 var(--gold); margin-bottom: 14px;
  }
  p { font-size: 17px; line-height: 1.55; }
  .home {
    display: inline-block; margin-top: 22px; text-decoration: none;
    font-family: "Pirata One", serif; font-size: 20px; letter-spacing: .04em;
    padding: 11px 20px; background: var(--accent); color: var(--parch);
    border: 3px solid var(--gold);
  }
  .home:hover { background: var(--ink); color: var(--gold); }
</style>
